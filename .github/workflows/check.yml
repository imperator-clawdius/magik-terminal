name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python tools/check-shader.py
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          python tools/check-macos-shader.py
      - name: Install Ghostty
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask ghostty
          codesign --verify --deep --strict /Applications/Ghostty.app
      - name: Check macOS config and native session
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: python -u tools/smoke-macos.py --config-only
      - name: Check separate Mac GUI instance
        if: matrix.os == 'macos-15-intel'
        timeout-minutes: 3
        run: python -u tools/smoke-macos.py
