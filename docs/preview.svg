<text x="147" y="415" font-size="17" fill="#f0b34a">const <tspan fill="#f2efe6">signal = {</tspan></text>
<text x="172" y="447" font-size="17" fill="#f2efe6">name: <tspan fill="#3be0c8">"Magik Terminal"</tspan>,</text>
<text x="172" y="479" font-size="17" fill="#f2efe6">mode: <tspan fill="#3be0c8">"make it yours"</tspan></text>
